<style>
  :root{
    --bg:#0f1115;
    --card:#151923;
    --ink:#e9eef7;
    --muted:#a9b3c9;
    --accent:#6aa9ff;
    --chip:#232a3a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    background:linear-gradient(180deg,#0d1017,#0f1115 120vh);
    color:var(--ink);
  }
  header{
    position:sticky; top:0; z-index:10;
    backdrop-filter:saturate(160%) blur(6px);
    background:rgba(13,16,23,.75);
    border-bottom:1px solid #1e2433;
  }
  .bar{
    max-width:1200px; margin:auto; padding:10px 16px;
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  h1{font-size:18px; margin:0; letter-spacing:.2px}
  .search{
    display:flex; align-items:center; gap:8px;
    background:#0c101a; border:1px solid #1e2433; border-radius:10px;
    padding:8px 10px; flex:1 1 260px;
  }
  .search input{
    outline:none; border:none; background:transparent; color:var(--ink); width:100%;
    font-size:14px;
  }
  .filters{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-left:auto;
  }
  .chip{
    background:var(--chip); border:1px solid #263148; color:var(--muted);
    padding:6px 10px; border-radius:999px; font-size:12px; cursor:pointer;
    user-select:none;
  }
  .chip.active{ color:var(--ink); border-color:var(--accent); box-shadow:0 0 0 1px rgba(106,169,255,.35) inset}
  .sorter{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    background:#0c101a; border:1px solid #1e2433; border-radius:10px; padding:6px 8px;
  }
  .sorter label{font-size:12px; color:var(--muted)}
  .sorter select{
    background:#0c101a; color:var(--ink); border:1px solid #22304a; border-radius:8px; padding:6px 8px; font-size:12px;
  }
  main{max-width:1200px; margin:16px auto; padding:0 16px 80px}
  .grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:12px;
  }
  @media (max-width:1050px){ .grid{ grid-template-columns:repeat(5,1fr)} }
  @media (max-width:900px){ .grid{ grid-template-columns:repeat(4,1fr)} }
  @media (max-width:700px){ .grid{ grid-template-columns:repeat(3,1fr)} }
  @media (max-width:520px){ .grid{ grid-template-columns:repeat(2,1fr)} }

  .card{
    background:var(--card);
    border:1px solid #1e2433;
    border-radius:12px;
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:#2a3550;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  .imgwrap{
    aspect-ratio:1/1;
    background:#0c1017;
    display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid #1e2433;
    position:relative;
  }
  .imgwrap img{
    width:88%; height:88%; object-fit:contain; image-rendering:auto;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
  }
  .qty{
    position:absolute; top:8px; right:8px;
    background:rgba(12,16,26,.85);
    border:1px solid #2a3550;
    padding:2px 6px; border-radius:8px;
    font-size:12px; color:var(--ink);
  }
  .body{ padding:10px }
  .name{
    font-size:13px; line-height:1.25; margin:0 0 6px; color:var(--ink);
    min-height:2.5em;
  }
  .meta{
    display:flex; gap:6px; flex-wrap:wrap; align-items:center;
    color:var(--muted); font-size:11px;
  }
  .tag{ background:#101521; border:1px solid #20293d; padding:3px 6px; border-radius:6px }
  .pagination{
    display:flex; gap:8px; justify-content:center; margin:24px 0 0;
  }
  .pagebtn{
    background:#0c1017; border:1px solid #22304a; color:var(--ink);
    padding:8px 12px; border-radius:10px; cursor:pointer; font-size:13px;
  }
  .pagebtn[disabled]{ opacity:.4; cursor:not-allowed }
  .pageinfo{ color:var(--muted); font-size:13px; padding:8px 0 }
  footer{
    position:fixed; left:0; right:0; bottom:0;
    background:rgba(10,12,18,.9); border-top:1px solid #1e2433;
    backdrop-filter:saturate(160%) blur(6px);
  }
  .foot{
    max-width:1200px; margin:auto; padding:10px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:12px; color:var(--muted);
  }
  .countchip{ background:#0c1017; border:1px solid #22304a; color:var(--ink); padding:4px 8px; border-radius:999px }
</style>

const PAGE_SIZE = 36;
let page = 1;
let filter = "all";
let query = "";
let sortMode = "name_az";

const $grid = document.getElementById("grid");
const $pageinfo = document.getElementById("pageinfo");
const $prev = document.getElementById("prev");
const $next = document.getElementById("next");
const $countchip = document.getElementById("countchip");
const $q = document.getElementById("q");
const $sort = document.getElementById("sort");

function lebornRank(val){
  if(!val || val==="—") return 9999;
  const map = {
    "1": 1, "1-2": 2, "2": 3, "2-3": 4, "2-4": 5,
    "3": 6, "3-4": 7, "3-5": 8, "4-5": 9,
    "Permanent Buyable": 100, "Permanent Dyewworks": 110
  };
  if(/^Dyewworks/i.test(val)) return 120;
  if(/^Current Dyeable/i.test(val)) return 130;
  return map[val] ?? 500 + val.toLowerCase().charCodeAt(0);
}

function sortItems(items){
  const arr = items.slice();
  if(sortMode==="name_az"){
    arr.sort((a,b)=>a.name.localeCompare(b.name));
  }else if(sortMode==="name_za"){
    arr.sort((a,b)=>b.name.localeCompare(a.name));
  }else if(sortMode==="leborn"){
    arr.sort((a,b)=>{
      const ra = lebornRank(a.leborn||"—");
      const rb = lebornRank(b.leborn||"—");
      if(ra!==rb) return ra - rb;
      return a.name.localeCompare(b.name);
    });
  }
  return arr;
}

function applyFilter(){
  let out = DATA.slice();
  if(filter==="le1") out = out.filter(it=>it.leborn==="1");
  else if(filter==="le12") out = out.filter(it=>it.leborn==="1-2");
  else if(filter==="none") out = out.filter(it=>!it.leborn || it.leborn==="—");
  if(query.trim()){
    const ql = query.trim().toLowerCase();
    out = out.filter(it =>
      it.name.toLowerCase().includes(ql) ||
      (it.type||"").toLowerCase().includes(ql) ||
      (it.leborn||"").toLowerCase().includes(ql)
    );
  }
  out = sortItems(out);
  return out;
}

function paginate(items){
  const start = (page-1)*PAGE_SIZE;
  return items.slice(start, start+PAGE_SIZE);
}

function render(){
  const items = applyFilter();
  const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  if(page>pages) page = pages;

  $grid.innerHTML = paginate(items).map(cardHTML).join("");
  $pageinfo.textContent = `Page ${page} / ${pages}`;
  $prev.disabled = (page<=1);
  $next.disabled = (page>=pages);

  // footer counter
  const totalQty = items.reduce((a,b)=>a + (Number(b.qty)||0), 0);
  $countchip.textContent = `${items.length} items • ${totalQty} total qty`;
}

function cardHTML(it){
  const lbText = it.leborn ? it.leborn : "—";
  const safeImg = it.image || "";
  return `
  <article class="card" data-name="${escapeHTML(it.name)}" data-leborn="${escapeHTML(lbText)}">
    <div class="imgwrap">
      <img src="${safeImg}" alt="${escapeHTML(it.name)}" loading="lazy" />
      <div class="qty">×${it.qty||1}</div>
    </div>
    <div class="body">
      <h3 class="name">${escapeHTML(it.name)}</h3>
      <div class="meta">
        <span class="tag">${escapeHTML(it.type||"Wearable")}</span>
        <span class="tag">LeBorn: ${escapeHTML(lbText)}</span>
      </div>
    </div>
  </article>
  `;
}

function escapeHTML(s){ return (s||"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

// Events
document.querySelectorAll('.chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    page = 1;
    render();
  });
});
$q.addEventListener('input', e=>{
  query = e.target.value || "";
  page = 1;
  render();
});
$prev.addEventListener('click', ()=>{ if(page>1){ page--; render(); }});
$next.addEventListener('click', ()=>{ page++; render(); });
$sort.addEventListener('change', e=>{
  sortMode = e.target.value;
  page = 1;
  render();
});

// Initial render
render();
</script>
